name: OSV org-wide scan

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: osv-org-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install OSV-Scanner
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64"
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan public repos
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p work report
          {
            echo "# OSV org-wide report"
            echo
            echo "Owner: raimonvibe · $(date -u +%Y-%m-%dT%H:%M:%SZ) · scanner v2.6.0"
            echo
            echo "Public non-fork non-archived repos only. Findings are lockfile/manifest CVEs, not container OS packages."
            echo
          } > report/osv-org-report.md

          : > report/vuln.jsonl
          : > report/clean.txt
          : > report/skipped.txt
          : > report/failed.txt

          mapfile -t repos < <(gh api --paginate "users/raimonvibe/repos?type=owner&per_page=100" \
            --jq '.[] | select(.fork==false and .archived==false and .private==false) | .name' | sort)

          echo "Repos: ${#repos[@]}" >> report/osv-org-report.md
          echo >> report/osv-org-report.md

          vulns=0
          scanned=0
          skipped=0
          failed=0

          for repo in "${repos[@]}"; do
            echo "::group::${repo}"
            rm -rf "work/${repo}"
            if ! git clone --depth 1 --quiet "https://github.com/raimonvibe/${repo}.git" "work/${repo}"; then
              echo "- **${repo}**: clone failed" >> report/osv-org-report.md
              echo "${repo}" >> report/failed.txt
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi

            set +e
            osv-scanner scan source --recursive --format markdown "work/${repo}" > "work/${repo}.md" 2> "work/${repo}.err"
            status=$?
            set -e

            if grep -qiE 'no packages found|no package sources found' "work/${repo}.err" "work/${repo}.md" 2>/dev/null; then
              echo "- **${repo}**: no lockfiles/manifests" >> report/osv-org-report.md
              echo "${repo}" >> report/skipped.txt
              skipped=$((skipped + 1))
            elif [ "$status" -eq 0 ]; then
              echo "- **${repo}**: clean" >> report/osv-org-report.md
              echo "${repo}" >> report/clean.txt
              scanned=$((scanned + 1))
            elif [ "$status" -eq 1 ]; then
              echo "- **${repo}**: vulnerabilities found" >> report/osv-org-report.md
              echo >> report/osv-org-report.md
              echo "<details><summary>${repo} details</summary>" >> report/osv-org-report.md
              echo >> report/osv-org-report.md
              cat "work/${repo}.md" >> report/osv-org-report.md
              echo >> report/osv-org-report.md
              echo "</details>" >> report/osv-org-report.md
              echo >> report/osv-org-report.md
              python3 - "$repo" "work/${repo}.md" >> report/vuln.jsonl <<'PY'
          import json, re, sys
          repo, path = sys.argv[1], sys.argv[2]
          text = open(path, errors="replace").read()
          m = re.search(
              r"Total (\d+) packages? affected by (\d+) known vulnerabilit(?:y|ies) "
              r"\((\d+) Critical, (\d+) High, (\d+) Medium, (\d+) Low, (\d+) Unknown\)",
              text,
          )
          fix = re.search(r"(\d+) vulnerabilit(?:y|ies) can be fixed", text)
          row = {"repo": repo, "c": "?", "h": "?", "med": "?", "l": "?", "pkgs": "?", "vulns": "found", "fixable": "?"}
          if m:
              row.update(
                  pkgs=int(m.group(1)),
                  vulns=int(m.group(2)),
                  c=int(m.group(3)),
                  h=int(m.group(4)),
                  med=int(m.group(5)),
                  l=int(m.group(6)),
              )
          if fix:
              row["fixable"] = int(fix.group(1))
          print(json.dumps(row))
          PY
              vulns=$((vulns + 1))
              scanned=$((scanned + 1))
            else
              echo "- **${repo}**: scanner error (exit ${status})" >> report/osv-org-report.md
              echo "${repo}" >> report/failed.txt
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          {
            echo
            echo "## Totals"
            echo
            echo "| Result | Count |"
            echo "| --- | ---: |"
            echo "| Repos listed | ${#repos[@]} |"
            echo "| Scanned | ${scanned} |"
            echo "| With vulnerabilities | ${vulns} |"
            echo "| No lockfiles | ${skipped} |"
            echo "| Clone/scanner errors | ${failed} |"
          } >> report/osv-org-report.md

          LISTED="${#repos[@]}" SCANNED="${scanned}" VULN_COUNT="${vulns}" SKIPPED_COUNT="${skipped}" FAILED_COUNT="${failed}" python3 - <<'PY'
          import json, os
          from pathlib import Path

          def lines(path):
              p = Path(path)
              if not p.exists():
                  return []
              return [ln.strip() for ln in p.read_text().splitlines() if ln.strip()]

          vulns = []
          vuln_path = Path("report/vuln.jsonl")
          if vuln_path.exists() and vuln_path.stat().st_size:
              for ln in vuln_path.read_text().splitlines():
                  if ln.strip():
                      vulns.append(json.loads(ln))

          def sort_key(row):
              def n(v):
                  return v if isinstance(v, int) else -1
              return (n(row.get("c")), n(row.get("h")), n(row.get("med")), n(row.get("vulns")))

          vulns.sort(key=sort_key, reverse=True)
          clean = lines("report/clean.txt")
          skipped = lines("report/skipped.txt")
          failed = lines("report/failed.txt")
          run_url = os.environ.get("RUN_URL", "")
          listed = os.environ.get("LISTED", "")
          scanned = os.environ.get("SCANNED", str(len(vulns) + len(clean)))
          vuln_count = os.environ.get("VULN_COUNT", str(len(vulns)))
          skipped_count = os.environ.get("SKIPPED_COUNT", str(len(skipped)))
          failed_count = os.environ.get("FAILED_COUNT", str(len(failed)))

          out = []
          out.append("# OSV org-wide report")
          out.append("")
          out.append(Path("report/osv-org-report.md").read_text().splitlines()[2])
          out.append("")
          out.append("Public non-fork non-archived repos only. Findings are lockfile/manifest CVEs, not container OS packages.")
          out.append("")
          out.append(f"Full tables: [this workflow run]({run_url}) (artifact `osv-org-report`). GitHub issue bodies cap at 65,536 characters, so details stay in the artifact.")
          out.append("")
          out.append("## Totals")
          out.append("")
          out.append("| Result | Count |")
          out.append("| --- | ---: |")
          out.append(f"| Repos listed | {listed} |")
          out.append(f"| Scanned | {scanned} |")
          out.append(f"| With vulnerabilities | {vuln_count} |")
          out.append(f"| No lockfiles | {skipped_count} |")
          out.append(f"| Clone/scanner errors | {failed_count} |")
          out.append("")
          out.append("## Repos with vulnerabilities")
          out.append("")
          out.append("Sorted by Critical, then High.")
          out.append("")
          out.append("| Repo | Critical | High | Medium | Low | Packages | Vulns | Fixable |")
          out.append("| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |")
          for row in vulns:
              out.append(
                  f"| {row['repo']} | {row['c']} | {row['h']} | {row['med']} | {row['l']} | {row['pkgs']} | {row['vulns']} | {row['fixable']} |"
              )
          out.append("")
          out.append("## Clean")
          out.append("")
          out.append(", ".join(f"`{name}`" for name in clean) or "_None_")
          out.append("")
          out.append("## No lockfiles")
          out.append("")
          out.append(", ".join(f"`{name}`" for name in skipped) or "_None_")
          out.append("")
          out.append("## Clone/scanner errors")
          out.append("")
          out.append(", ".join(f"`{name}`" for name in failed) or "_None_")
          out.append("")
          Path("report/osv-org-issue.md").write_text("\n".join(out))
          print(f"issue_chars={Path('report/osv-org-issue.md').stat().st_size}")
          PY

          echo "VULN_REPOS=${vulns}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: osv-org-report
          path: |
            report/osv-org-report.md
            report/osv-org-issue.md

      - name: Ensure issue labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create osv --color 0E8A16 --description "OSV scanner" --force
          gh label create automated --color 5319E7 --description "Opened by GitHub Actions" --force

      - name: Publish report issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const MAX = 60000;
            let body = fs.readFileSync('report/osv-org-issue.md', 'utf8');
            if (body.length > MAX) {
              body = body.slice(0, MAX).replace(/\n[^\n]*$/, '') +
                '\n\n…truncated. See the `osv-org-report` artifact on this workflow run for the full scan.';
            }
            const title = 'OSV org-wide report';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'osv,automated',
              per_page: 10,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['osv', 'automated'],
              });
            }
